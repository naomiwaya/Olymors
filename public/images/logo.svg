<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- OM Monogram matching real logo -->
  <g transform="translate(4, 4)">
    <!-- O - bold navy rounded rectangle -->
    <rect x="2" y="2" width="40" height="50" rx="6" ry="6"
          fill="#1a2b5c" />
    <rect x="9" y="10" width="26" height="34" rx="4" ry="4"
          fill="white" />
    <!-- M outer navy shape -->
    <path d="M 46 2 L 46 52 L 56 32 L 66 52 L 76 2 L 82 2 L 82 52 L 76 52 L 76 18 L 66 38 L 56 18 L 56 52 L 46 52 L 46 2 Z"
          fill="#1a2b5c" />
    <!-- M inner gold accent -->
    <path d="M 54 14 L 54 52 L 58 52 L 58 28 L 66 44 L 74 28 L 74 52 L 78 52 L 78 14 L 66 38 Z"
          fill="#c9a227" />
  </g>

  <!-- OLYMORS text -->
  <text x="96" y="42"
        font-family="Manrope, Arial, sans-serif"
        font-weight="800"
        font-size="32"
        fill="#1a2b5c"
        letter-spacing="-0.5">OLYMORS</text>

  <!-- Dash + INVESTMENT LIMITED + Dash -->
  <text x="96" y="66"
        font-family="Manrope, Arial, sans-serif"
        font-weight="600"
        font-size="10"
        fill="#c9a227"
        letter-spacing="2.5">— INVESTMENT LIMITED —</text>
</svg>
