<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <!-- Deep navy background -->
  <rect width="1440" height="900" fill="#0a1628"/>
  
  <!-- Engineering grid - fine lines -->
  <defs>
    <pattern id="grid-fine" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(201,162,39,0.04)" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-coarse" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(201,162,39,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="heroGlow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(201,162,39,0.12)"/>
      <stop offset="100%" stop-color="rgba(10,22,40,0)"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="rgba(13,31,60,0.8)"/>
      <stop offset="100%" stop-color="rgba(10,22,40,0)"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(201,162,39,0)"/>
      <stop offset="50%" stop-color="rgba(201,162,39,0.3)"/>
      <stop offset="100%" stop-color="rgba(201,162,39,0)"/>
    </linearGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  
  <!-- Grid overlays -->
  <rect width="1440" height="900" fill="url(#grid-fine)"/>
  <rect width="1440" height="900" fill="url(#grid-coarse)"/>
  
  <!-- Glow effects -->
  <rect width="1440" height="900" fill="url(#heroGlow1)"/>
  
  <!-- Large OM Monogram watermark — centered, transparent -->
  <g opacity="0.03" transform="translate(520, 150)">
    <!-- O shape -->
    <ellipse cx="200" cy="280" rx="190" ry="260" fill="none" stroke="#c9a227" stroke-width="30"/>
    <!-- M shape -->
    <path d="M 430 60 L 430 500 L 550 200 L 670 500 L 670 60" fill="none" stroke="#c9a227" stroke-width="30" stroke-linejoin="round"/>
    <!-- Outer ring decorative -->
    <ellipse cx="200" cy="280" rx="230" ry="300" fill="none" stroke="#c9a227" stroke-width="4" stroke-dasharray="20 10"/>
  </g>
  
  <!-- Golden accent arc — top left -->
  <path d="M -100 200 Q 200 -50 600 100" stroke="url(#goldLine)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M -100 250 Q 200 0 600 150" stroke="url(#goldLine)" stroke-width="0.8" fill="none" opacity="0.3"/>
  
  <!-- Engineering geometry lines — blueprint style -->
  <g opacity="0.08" stroke="#c9a227" stroke-width="0.8">
    <!-- Diagonal construction lines -->
    <line x1="0" y1="0" x2="1440" y2="900"/>
    <line x1="720" y1="0" x2="1440" y2="450"/>
    <line x1="0" y1="450" x2="720" y2="900"/>
  </g>

  <!-- Architectural corner brackets - top left -->
  <g opacity="0.15" stroke="#c9a227" stroke-width="1.5" fill="none">
    <path d="M 60 20 L 20 20 L 20 60"/>
    <path d="M 80 20 L 20 20 L 20 80"/>
    <!-- dots at intersections -->
    <circle cx="20" cy="20" r="3" fill="#c9a227"/>
  </g>

  <!-- Architectural corner brackets - bottom right -->
  <g opacity="0.15" stroke="#c9a227" stroke-width="1.5" fill="none" transform="translate(1440,900) rotate(180)">
    <path d="M 60 20 L 20 20 L 20 60"/>
    <path d="M 80 20 L 20 20 L 20 80"/>
    <circle cx="20" cy="20" r="3" fill="#c9a227"/>
  </g>
  
  <!-- Floating geometric shapes — engineering inspired -->
  <!-- Hexagon shape top right -->
  <g opacity="0.06" transform="translate(1150, 80)" fill="none" stroke="#c9a227" stroke-width="1">
    <polygon points="80,0 160,40 160,120 80,160 0,120 0,40" />
    <polygon points="80,20 140,50 140,110 80,140 20,110 20,50" />
  </g>
  
  <!-- Gear / cog geometry bottom left -->
  <g opacity="0.05" transform="translate(80, 650)" fill="none" stroke="#c9a227" stroke-width="1.2">
    <circle cx="80" cy="80" r="70"/>
    <circle cx="80" cy="80" r="50"/>
    <circle cx="80" cy="80" r="30"/>
    <line x1="80" y1="10" x2="80" y2="150"/>
    <line x1="10" y1="80" x2="150" y2="80"/>
    <line x1="30" y1="30" x2="130" y2="130"/>
    <line x1="130" y1="30" x2="30" y2="130"/>
  </g>

  <!-- Small accent dots -->
  <g fill="rgba(201,162,39,0.2)">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="200" cy="150" r="1.5"/>
    <circle cx="1340" cy="800" r="2"/>
    <circle cx="1280" cy="750" r="1.5"/>
    <circle cx="400" cy="50" r="1.5"/>
    <circle cx="900" cy="870" r="2"/>
    <circle cx="700" cy="30" r="1.5"/>
  </g>
  
  <!-- Right side vertical gold accent line -->
  <line x1="1380" y1="0" x2="1380" y2="900" stroke="rgba(201,162,39,0.06)" stroke-width="1"/>
  <line x1="1400" y1="0" x2="1400" y2="900" stroke="rgba(201,162,39,0.03)" stroke-width="1"/>
  
  <!-- Bottom gradient overlay -->
  <rect width="1440" height="200" y="700" fill="url(#heroGlow2)" opacity="0.4"/>
</svg>
